name: Deploy to Coolify

# Coolify's API is reachable only over Tailscale (locked down — no public
# exposure), so GitHub's webhooks can't reach it. Instead, on push to main this
# workflow joins the tailnet as an ephemeral node and calls the Coolify deploy
# API directly.
#
# To ENABLE (currently no-ops until the repo variable below is set):
#   Repo → Settings → Secrets and variables → Actions
#   Variables:
#     COOLIFY_HOST     = 100.94.121.24:8000              (the box's tailscale addr)
#     COOLIFY_APP_UUID = ieunvd3nlxbnv1chvg3ghc3n        (the jwrg app)
#   Secrets:
#     TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  - a Tailscale OAuth client scoped to
#                                             tag:ci (define tag:ci in the tailnet
#                                             ACL and authorize the OAuth client)
#     COOLIFY_TOKEN                          - the scoped Coolify API token
#
# Also: in Coolify Settings → API, leave "Allowed IPs for API Access" EMPTY.
# A range there (even the tailnet's) 403s every deploy — see jwrg/deploy/COOLIFY-PILOT.md.

on:
  push:
    branches: [main]

# Shared with refresh-coolify.yml (the 6-hourly rebuild) so a push deploy and a
# scheduled rebuild can't run at once — the Coolify droplet can't build two
# images concurrently (they fail at "exporting layers").
concurrency:
  group: coolify-deploy-jwrg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No-op until configured, so pushes never fail before the secrets exist.
    if: ${{ vars.COOLIFY_APP_UUID != '' }}
    steps:
      - name: Join Tailscale (ephemeral)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "http://${{ vars.COOLIFY_HOST }}/api/v1/deploy?uuid=${{ vars.COOLIFY_APP_UUID }}&force=false"
